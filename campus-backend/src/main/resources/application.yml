# 基础服务配置
server:
  port: 8081
  servlet:
    context-path: /api/v1

# Spring 基础配置
spring:
  application:
    name: campus-trading-system

  banner:
    location: classpath:banner.txt

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    static-path-pattern: /static/**

  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/campus_trading?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false
    # 注意：真实账号密码请放在本地 application-local.yml 中
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA & Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        show_sql: false
    open-in-view: false

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

  # JSON 序列化
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

# JWT 认证配置
jwt:
  # 请在本地配置中覆盖为强随机密钥（至少32字符）
  secret: campusSystemJwtSecretKey2024ForSecureAuthentication
  expiration: 86400000
  header: Authorization
  prefix: Bearer 

# MinIO 文件存储
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: campus-system
  secure: false
  url-prefix: http://localhost:9000 /campus-system
  # 性能优化配置
  connection-timeout: 30000
  connection-acquire-timeout: 60000
  connection-pool-size: 20
  read-timeout: 60000
  write-timeout: 60000

# 文件上传参数
file:
  upload:
    max-size: 20971520
    allowed-types: jpg,jpeg,png,gif,webp,mp4,avi,mov

# 日志输出
logging:
  level:
    com.example.campussystem: INFO
    org.springframework.security: WARN
    org.springframework.boot: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
    com.zaxxer.hikari: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/campus-trading-system.log

# Actuator 监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# 自定义应用配置
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,file://
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

  security:
    password:
      min-length: 6
      require-uppercase: false
      require-lowercase: false
      require-digit: false

    rate-limit:
      enabled: false
      requests-per-minute: 100

# DeepSeek AI 助手配置
deepseek:
  api:
    # 真实 Key 请通过环境变量 DEEPSEEK_API_KEY 或本地 application-local.yml 配置
    key: ${DEEPSEEK_API_KEY:sk-your-api-key-here}
    base-url: https://api.deepseek.com
    model: deepseek-r1-0528
    timeout: 60000
    max-tokens: 2000
    temperature: 0.7
  assistant:
    name: 校园交易小助手
    system-prompt: |
      你是一个专业的校园二手交易平台智能客服助手。你的职责是：
      1. 回答用户关于平台使用的问题
      2. 帮助用户解决交易过程中遇到的问题
      3. 提供商品推荐和搜索建议
      4. 解答关于订单、支付、物流等问题
      5. 处理用户投诉和建议
      
      请用友好、专业的语气回答问题，保持简洁明了。如果遇到无法解决的问题，建议用户联系人工客服。